<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Hunchkins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="app home3d">
<header class="home-head">
  <h1>Hunchkins</h1>
  <p>Deduction puzzles for kids. Pick a book, read the story, solve the maps.</p>
</header>

<div id="shelf3d" class="shelf3d" aria-hidden="true"></div>

<aside id="teaser" class="teaser" aria-live="polite">
  <button id="tClose" class="icon-btn close" type="button" aria-label="Put the book back">&times;</button>
  <h2 id="tTitle"></h2>
  <p id="tText"></p>
  <p id="tMeta" class="meta"></p>
  <div class="t-actions">
    <button id="tOpen" class="primary big" type="button">Open the book</button>
    <a id="tPdf" class="btn" href="#" download>⬇ Printable PDF</a>
  </div>
</aside>

<!-- The same books as a plain list, for screen readers and browsers without 3D -->
<nav class="booklist" id="booklist" aria-label="Stories"></nav>

<script src="art.js"></script>
<script src="puzzles/book/cases.js"></script>
<script src="puzzles/tutorial/cases.js"></script>
<script src="stories.js"></script>
<script>
  (() => {
    const list = document.getElementById("booklist");
    list.innerHTML = window.STORIES.filter(s => !s.soon).map(s =>
      `<a href="play.html?s=${s.id}" style="--spine:${s.spine}">${s.title}</a>` + (s.pdf ? `<a class="pdf" href="${s.pdf}" download>PDF</a>` : "")).join("");
    const gl = (() => { try { return !!document.createElement("canvas").getContext("webgl2"); } catch { return false; } })();
    if (!gl) document.body.classList.add("no3d");
  })();
</script>
<script type="module" src="js/shelf.js"></script>
</body>
</html>
